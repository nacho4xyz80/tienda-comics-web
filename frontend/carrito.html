<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito - Tienda de Cómics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">ComicsWeb</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="carrito.html">Carrito <span class="badge bg-primary" id="contador-carrito">0</span></a>
                <!-- <a class="nav-link" href="login.html">Login</a> -->
                <a class="nav-link" href="login.html" id="nav-login">Login</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <a href="index.html" class="btn btn-outline-secondary mb-4">&larr; Volver al catálogo</a>
        
        <h2 class="mb-4">Tu Carrito de Compras</h2>
        
        <div class="bg-white p-4 shadow-sm rounded">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Cómic</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-carrito">
                        </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                <h4 class="mb-0">Total: <span id="total-carrito" class="text-primary">$0.00</span></h4>
                <div>
                    <button class="btn btn-outline-danger me-2" onclick="vaciarCarrito()">Vaciar Carrito</button>
                    <button class="btn btn-success" onclick="simularCompra()">Finalizar Compra</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
