<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Cómic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">ComicsWeb</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="carrito.html">Carrito <span class="badge bg-primary" id="contador-carrito">0</span></a>
                <a class="nav-link" href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <a href="index.html" class="btn btn-outline-secondary mb-4">&larr; Volver al catálogo</a>
        
        <div class="row" id="mensaje-error"></div>

        <div class="row bg-white p-4 shadow-sm rounded" id="detalle-contenedor" style="display: none;">
            <div class="col-md-5 text-center mb-4 mb-md-0">
                <img id="detalle-imagen" src="" alt="Portada del cómic" class="img-fluid rounded" style="max-height: 500px; object-fit: cover;">
            </div>
            <div class="col-md-7 d-flex flex-column">
                <h2 id="detalle-titulo" class="mb-3"></h2>
                <h4 id="detalle-precio" class="text-primary mb-4"></h4>
                <p id="detalle-descripcion" class="fs-5 mb-5"></p>
                
                <div class="mt-auto">
                    <button id="btn-agregar-carrito" class="btn btn-success btn-lg w-100">
                        Añadir al Carrito
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
