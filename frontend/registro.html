<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tienda de Cómics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">ComicsWeb</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="carrito.html">Carrito <span class="badge bg-primary" id="contador-carrito">0</span></a>
                <a class="nav-link" href="login.html" id="nav-login">Login</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Crear Cuenta</h3>
                        
                        <div id="mensaje-registro"></div> 

                        <form id="form-registro">
                            <div class="mb-3">
                                <label for="reg-nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="reg-nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="reg-email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="reg-email" required>
                            </div>
                            <div class="mb-3">
                                <label for="reg-password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="reg-password" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 mb-3">Registrarse</button>
                            <div class="text-center">
                                <small>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></small>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- <script src="js/main.js"></script> -->
    <script type="module" src="js/main_hexagonal.js"></script>
</body>
</html>
